<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>doong owner</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px;
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: #0f1117; color: #e6e6e6;
  }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .panel {
    background: #1a1d26; border-radius: 10px; padding: 16px;
    margin-bottom: 16px; border: 1px solid #2a2f3d;
  }
  label { display: block; font-size: 13px; margin-bottom: 6px; color: #9aa3b2; }
  input[type="text"] {
    width: 100%; padding: 10px 12px; border-radius: 6px;
    border: 1px solid #2a2f3d; background: #0f1117; color: #e6e6e6;
    font-size: 14px; margin-bottom: 10px;
  }
  button {
    padding: 10px 16px; border-radius: 6px; border: none;
    background: #3b6cff; color: #fff; font-size: 14px;
    cursor: pointer; margin-right: 8px;
  }
  button:hover { background: #2a55d8; }
  button.danger { background: #d84a4a; }
  button.danger:hover { background: #b53838; }
  .session-info {
    font-size: 12px; color: #9aa3b2; margin-bottom: 12px;
    word-break: break-all; line-height: 1.7;
  }
  .session-info code {
    background: #0f1117; padding: 2px 6px; border-radius: 4px; color: #6dffb0;
  }
  .copy-btn {
    font-size: 11px; padding: 4px 8px; margin-left: 6px;
    background: #2a2f3d; color: #9aa3b2;
  }
  .copy-btn:hover { background: #3a4055; }
  #users {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 14px;
  }
  .user-card {
    background: #1a1d26; border: 1px solid #2a2f3d;
    border-radius: 10px; padding: 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .user-card .header {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px;
  }
  .badge {
    padding: 3px 8px; border-radius: 999px; font-size: 11px;
    background: #2a2f3d; color: #9aa3b2;
  }
  .badge.online { background: #1f5b3a; color: #6dffb0; }
  .badge.offline { background: #5b1f1f; color: #ff8c8c; }
  video {
    width: 100%; background: #000; border-radius: 6px;
    aspect-ratio: 16/9; object-fit: contain;
  }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .empty { color: #6b7280; font-size: 13px; padding: 20px; text-align: center; grid-column: 1/-1; }
</style>
</head>
<body>
  <h1>🎛️ doong owner（管理者画面）</h1>

  <div class="panel">
    <div class="session-info">
      セッションID（固定）: <code id="sessionId"></code><br>
      クライアントURL: <code id="clientUrl"></code>
      <button type="button" class="copy-btn" onclick="copyClientUrl()">📋 コピー</button>
    </div>
    <label>対象URL</label>
    <input type="text" id="urlInput" placeholder="https://example.com">
    <div>
      <button type="button" onclick="sendToAll()">📢 全員に送信</button>
      <button type="button" class="danger" onclick="resetAll()">🛑 全員リセット</button>
      <button type="button" class="danger" onclick="clearAllUsers()">🗑️ ユーザー一覧を全クリア</button>
    </div>
  </div>

  <div class="panel">
    <h3 style="margin:0 0 10px; font-size:15px;">接続中のユーザー</h3>
    <div id="users"><div class="empty">待機中... クライアントが接続すると表示されます</div></div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getDatabase, ref, onValue, set, push, update, remove, get
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ===== Firebase 設定 =====
const firebaseConfig = {
  apiKey: "AIzaSyDsoktNvfhnMSBrHLyhSjgLBLYiih7cMFE",
  authDomain: "doong-672e7.firebaseapp.com",
  databaseURL: "https://doong-672e7-default-rtdb.firebaseio.com",
  projectId: "doong-672e7",
  storageBucket: "doong-672e7.firebasestorage.app",
  messagingSenderId: "95643976140",
  appId: "1:95643976140:web:cdcb757a9bc25bc7a75d69"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ===== 固定セッションID =====
const FIXED_SESSION_ID = "doong-room";
const sessionId = FIXED_SESSION_ID;

document.getElementById("sessionId").textContent = sessionId;

const baseUrl = location.origin + location.pathname.replace(/index\.html$/, "").replace(/\/$/, "") + "/client/";
const clientUrl = baseUrl + "?u=" + "user1"; // 表示用
document.getElementById("clientUrl").textContent = clientUrl;

window.copyClientUrl = function() {
  const url = baseUrl;
  navigator.clipboard.writeText(url).then(() => {
    alert("クライアントURLをコピーしました:\n" + url);
  });
};

// ===== ユーザー監視 =====
const usersEl = document.getElementById("users");
const peerConnections = {};
const processedIce = {};
const USER_TIMEOUT_MS = 30000; // 30秒以上更新がないユーザーは死んだとみなす

const usersRef = ref(db, `sessions/${sessionId}/users`);
onValue(usersRef, (snap) => {
  const users = snap.val() || {};
  const now = Date.now();

  // 死んだユーザーを自動削除
  for (const [uid, user] of Object.entries(users)) {
    const lastSeen = user.status && user.status.lastSeen ? user.status.lastSeen : 0;
    if (now - lastSeen > USER_TIMEOUT_MS) {
      console.log("古いユーザーを削除:", uid);
      remove(ref(db, `sessions/${sessionId}/users/${uid}`));
      return;
    }
  }

  const ids = Object.keys(users);

  const empty = usersEl.querySelector(".empty");
  if (ids.length === 0) {
    if (!empty) {
      const d = document.createElement("div");
      d.className = "empty";
      d.textContent = "待機中... クライアントが接続すると表示されます";
      usersEl.appendChild(d);
    }
  } else if (empty) {
    empty.remove();
  }

  for (const uid of ids) {
    if (!document.getElementById("card-" + uid)) {
      createUserCard(uid, users[uid]);
    }
    updateUserStatus(uid, users[uid]);
    handleOffer(uid, users[uid]);
    handleIce(uid, users[uid]);
  }

  document.querySelectorAll(".user-card").forEach(card => {
    const uid = card.dataset.uid;
    if (!users[uid]) {
      cleanupPeer(uid);
      card.remove();
    }
  });
});

function createUserCard(uid, user) {
  const card = document.createElement("div");
  card.className = "user-card";
  card.id = "card-" + uid;
  card.dataset.uid = uid;
  card.innerHTML = `
    <div class="header">
      <strong>👤 ${uid}</strong>
      <span class="badge" id="badge-${uid}">offline</span>
    </div>
    <video id="video-${uid}" autoplay playsinline muted></video>
    <div class="actions">
      <button type="button" data-act="send" data-uid="${uid}">この人にURL送信</button>
      <button type="button" class="danger" data-act="stop" data-uid="${uid}">共有停止</button>
      <button type="button" class="danger" data-act="reset" data-uid="${uid}">リセット</button>
      <button type="button" class="danger" data-act="delete" data-uid="${uid}">削除</button>
    </div>
  `;
  usersEl.appendChild(card);

  card.querySelector('[data-act="send"]').onclick = () => sendToUser(uid);
  card.querySelector('[data-act="stop"]').onclick = () => closePeer(uid);
  card.querySelector('[data-act="reset"]').onclick = () => resetUser(uid);
  card.querySelector('[data-act="delete"]').onclick = () => deleteUser(uid);
}

function updateUserStatus(uid, user) {
  const badge = document.getElementById("badge-" + uid);
  if (!badge) return;
  const online = user.status && user.status.online === true;
  badge.textContent = online ? "online" : "offline";
  badge.className = "badge " + (online ? "online" : "offline");
}

// ===== WebRTC =====
const rtcConfig = {
  iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
};

function ensurePeer(uid) {
  if (peerConnections[uid] && peerConnections[uid].pc) return peerConnections[uid];
  const pc = new RTCPeerConnection(rtcConfig);
  const video = document.getElementById("video-" + uid);
  const remoteStream = new MediaStream();

  pc.ontrack = (e) => {
    e.streams[0].getTracks().forEach(t => remoteStream.addTrack(t));
    video.srcObject = remoteStream;
    video.play().catch(()=>{});
  };

  pc.onicecandidate = (e) => {
    if (e.candidate) {
      const iceRef = ref(db, `sessions/${sessionId}/users/${uid}/signal/adminIce`);
      push(iceRef, e.candidate.toJSON());
    }
  };

  peerConnections[uid] = { pc, video, remoteStream, answerSent: false };
  return peerConnections[uid];
}

async function handleOffer(uid, user) {
  const offer = user.signal && user.signal.offer;
  if (!offer) return;
  const peer = ensurePeer(uid);
  if (peer.answerSent) return;

  try {
    await peer.pc.setRemoteDescription(new RTCSessionDescription(offer));
    const answer = await peer.pc.createAnswer();
    await peer.pc.setLocalDescription(answer);
    peer.answerSent = true;
    await update(ref(db, `sessions/${sessionId}/users/${uid}/signal`), {
      answer: { type: answer.type, sdp: answer.sdp }
    });
  } catch (e) {
    console.warn("offer処理エラー", e);
  }
}

function handleIce(uid, user) {
  const ices = (user.signal && user.signal.userIce) || {};
  const peer = peerConnections[uid];
  if (!peer) return;
  processedIce[uid] = processedIce[uid] || new Set();
  for (const [key, cand] of Object.entries(ices)) {
    if (processedIce[uid].has(key)) continue;
    processedIce[uid].add(key);
    peer.pc.addIceCandidate(new RTCIceCandidate(cand)).catch(()=>{});
  }
}

function closePeer(uid) {
  const peer = peerConnections[uid];
  if (!peer) return;
  try { peer.pc.close(); } catch(e){}
  if (peer.video) peer.video.srcObject = null;
  delete peerConnections[uid];
  delete processedIce[uid];
  update(ref(db, `sessions/${sessionId}/users/${uid}/signal`), {
    adminStop: { ts: Date.now() }
  });
}

function cleanupPeer(uid) {
  closePeer(uid);
}

async function deleteUser(uid) {
  cleanupPeer(uid);
  await remove(ref(db, `sessions/${sessionId}/users/${uid}`));
}

async function clearAllUsers() {
  if (!confirm("本当に全ユーザーを一覧から削除しますか？")) return;
  await remove(ref(db, `sessions/${sessionId}/users`));
  usersEl.innerHTML = '<div class="empty">待機中... クライアントが接続すると表示されます</div>';
}

// ===== URL 送信 =====
async function sendToAll() {
  const url = document.getElementById("urlInput").value.trim();
  if (!url) return alert("URLを入力してください");
  await set(ref(db, `sessions/${sessionId}/command`), {
    url,
    timestamp: Date.now(),
    target: "all"
  });
  alert("全員に送信しました");
}

async function sendToUser(uid) {
  const url = document.getElementById("urlInput").value.trim();
  if (!url) return alert("URLを入力してください");
  await set(ref(db, `sessions/${sessionId}/users/${uid}/command`), {
    url,
    timestamp: Date.now()
  });
  alert(`${uid} に送信しました`);
}

async function resetUser(uid) {
  await set(ref(db, `sessions/${sessionId}/users/${uid}/command`), {
    url: "",
    timestamp: Date.now(),
    reset: true
  });
}

async function resetAll() {
  await set(ref(db, `sessions/${sessionId}/command`), {
    url: "",
    timestamp: Date.now(),
    reset: true,
    target: "all"
  });
}
</script>
</body>
</html>
