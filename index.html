  <h1>🎛️ doong owner（管理者画面）</h1>

  <div class="panel">

      セッションID: <code id="sessionId"></code><br>
      クライアントURL: <code id="clientUrl"></code>
      <button type="button" class="copy-btn" onclick="copyClientUrl()">📋 コピー</button>
    </div>
  </div>

  <div class="panel">
    <div class="section-title">🌐 URL送信</div>
    <label>対象URL</label>
    <input type="text" id="urlInput" placeholder="https://example.com">
    <div>
      <button type="button" onclick="sendToAll()">📢 全員にURL送信</button>
      <button type="button" class="danger" onclick="resetAll()">🛑 全員リセット</button>
    </div>
  </div>

  <div class="panel">
    <div class="section-title">🖥️ 画面共有</div>
    <div>
      <button type="button" class="green" onclick="requestShareAll()">🖥️ 全員に画面共有要求</button>
    </div>

  <div class="panel">

    <label>MP3ファイルを選択（5MB以下推奨）</label>

    <div class="upload-status" id="uploadStatus"></div>
    <div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>
    <div class="file-info" id="fileInfo"></div>

      <button type="button" class="purple" id="btnPlayAll" disabled onclick="playMusicAll()">🎵 全員に流す</button>

    </div>

  <div class="panel">
    <h3 style="margin:0 0 10px; font-size:15px;">接続中のユーザー</h3>

  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getDatabase, ref, onValue, set, push, update, remove
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDsoktNvfhnMSBrHLyhSjgLBLYiih7cMFE",
  authDomain: "doong-672e7.firebaseapp.com",
  databaseURL: "https://doong-672e7-default-rtdb.firebaseio.com",
  projectId: "doong-672e7",
  storageBucket: "doong-672e7.firebasestorage.app",
  messagingSenderId: "95643976140",
  appId: "1:95643976140:web:cdcb757a9bc25bc7a75d69"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const FIXED_SESSION_ID = "doong-room";
const sessionId = FIXED_SESSION_ID;

document.getElementById("sessionId").textContent = sessionId;
const baseUrl = location.origin + location.pathname.replace(/index\.html$/, "").replace(/\/$/, "") + "/client/";
document.getElementById("clientUrl").textContent = baseUrl;

window.copyClientUrl = function() {
  navigator.clipboard.writeText(baseUrl).then(() => {
    alert("クライアントURLをコピーしました:\n" + baseUrl);
  });
};

// ===== ユーザー監視 =====
const usersEl = document.getElementById("users");
const peerConnections = {};
const processedIce = {};
const USER_TIMEOUT_MS = 30000;

const usersRef = ref(db, `sessions/${sessionId}/users`);
onValue(usersRef, (snap) => {
  const users = snap.val() || {};
  const now = Date.now();

  for (const [uid, user] of Object.entries(users)) {
    const lastSeen = user.status && user.status.lastSeen ? user.status.lastSeen : 0;
    if (now - lastSeen > USER_TIMEOUT_MS) {
      remove(ref(db, `sessions/${sessionId}/users/${uid}`));
      return;
    }
  }

  const ids = Object.keys(users);
  const empty = usersEl.querySelector(".empty");
  if (ids.length === 0) {
    if (!empty) {
      const d = document.createElement("div");
      d.className = "empty";
      d.textContent = "待機中... クライアントが接続すると表示されます";
      usersEl.appendChild(d);
    }
  } else if (empty) empty.remove();

  for (const uid of ids) {
    if (!document.getElementById("card-" + uid)) createUserCard(uid, users[uid]);
    updateUserStatus(uid, users[uid]);
    handleOffer(uid, users[uid]);
    handleIce(uid, users[uid]);
  }

  document.querySelectorAll(".user-card").forEach(card => {
    const uid = card.dataset.uid;
    if (!users[uid]) {
      cleanupPeer(uid);
      card.remove();
    }
  });
});

// ===== WebRTC =====
const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

function ensurePeer(uid) {
  if (peerConnections[uid] && peerConnections[uid].pc) return peerConnections[uid];
  const pc = new RTCPeerConnection(rtcConfig);
  const video = document.getElementById("video-" + uid);
  const remoteStream = new MediaStream();

  pc.ontrack = (e) => {
    e.streams[0].getTracks().forEach(t => remoteStream.addTrack(t));
    video.srcObject = remoteStream;
    video.play().catch(()=>{});
  };

  pc.onicecandidate = (e) => {
    if (e.candidate) {
      push(ref(db, `sessions/${sessionId}/users/${uid}/signal/adminIce`),
        e.candidate.toJSON());
    }
  };

  peerConnections[uid] = { pc, video, remoteStream, answerSent: false };
  return peerConnections[uid];
}

async function handleOffer(uid, user) {
  const offer = user.signal && user.signal.offer;
  if (!offer) return;
  const peer = ensurePeer(uid);
  if (peer.answerSent) return;
  try {
    await peer.pc.setRemoteDescription(new RTCSessionDescription(offer));
    const answer = await peer.pc.createAnswer();
    await peer.pc.setLocalDescription(answer);
    peer.answerSent = true;
    await update(ref(db, `sessions/${sessionId}/users/${uid}/signal`), {
      answer: { type: answer.type, sdp: answer.sdp }
    });
  } catch (e) { console.warn(e); }
}

function handleIce(uid, user) {
  const ices = (user.signal && user.signal.userIce) || {};
  const peer = peerConnections[uid];
  if (!peer) return;
  processedIce[uid] = processedIce[uid] || new Set();
  for (const [key, cand] of Object.entries(ices)) {
    if (processedIce[uid].has(key)) continue;
    processedIce[uid].add(key);
    peer.pc.addIceCandidate(new RTCIceCandidate(cand)).catch(()=>{});
  }
}

function closePeer(uid) {
  const peer = peerConnections[uid];
  if (!peer) return;
  try { peer.pc.close(); } catch(e){}
  if (peer.video) peer.video.srcObject = null;
  delete peerConnections[uid];
  delete processedIce[uid];
  update(ref(db, `sessions/${sessionId}/users/${uid}/signal`), {
    adminStop: { ts: Date.now() }
  });
}

function cleanupPeer(uid) { closePeer(uid); }

async function deleteUser(uid) {
  cleanupPeer(uid);
  await remove(ref(db, `sessions/${sessionId}/users/${uid}`));
}

// ===== 音楽（Base64でRealtime DBに保存） =====
let currentMusicData = null;  // { dataUrl, name, size }

const musicFileInput = document.getElementById("musicFile");
const uploadStatus = document.getElementById("uploadStatus");
const progressBar = document.getElementById("progressBar");
const progressFill = document.getElementById("progressFill");
const fileInfo = document.getElementById("fileInfo");
const btnPlayAll = document.getElementById("btnPlayAll");

musicFileInput.addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  // サイズチェック（5MBまで）
  if (file.size > 5 * 1024 * 1024) {
    alert("ファイルサイズが大きすぎます（5MB以下にしてください）\n" +
          `現在: ${(file.size / 1024 / 1024).toFixed(2)} MB`);
    musicFileInput.value = "";
    return;
  }

  // 形式チェック
  if (!file.type.startsWith("audio/")) {
    alert("音声ファイルを選択してください");
    musicFileInput.value = "";
    return;
  }

  uploadStatus.className = "upload-status show uploading";
  uploadStatus.textContent = "ファイルを変換中...";
  progressBar.classList.add("show");
  progressFill.style.width = "0%";
  fileInfo.classList.remove("show");
  btnPlayAll.disabled = true;

  try {
    const dataUrl = await fileToDataUrl(file, (pct) => {
      progressFill.style.width = pct + "%";
      uploadStatus.textContent = `変換中... ${pct.toFixed(0)}%`;
    });

    currentMusicData = {
      dataUrl,
      name: file.name,
      size: file.size
    };

    uploadStatus.className = "upload-status show done";
    uploadStatus.textContent = "✅ 準備完了";

    fileInfo.textContent = `🎵 ${file.name}（${(file.size / 1024 / 1024).toFixed(2)} MB）`;
    fileInfo.classList.add("show");

    progressBar.classList.remove("show");
    btnPlayAll.disabled = false;
  } catch (err) {
    console.error(err);
    uploadStatus.className = "upload-status show error";
    uploadStatus.textContent = "❌ 変換失敗: " + err.message;
    progressBar.classList.remove("show");
    btnPlayAll.disabled = true;
  }
});

function fileToDataUrl(file, onProgress) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onprogress = (e) => {
      if (e.lengthComputable && onProgress) {
        onProgress((e.loaded / e.total) * 100);
      }
    };
    reader.onload = () => {
      if (onProgress) onProgress(100);
      resolve(reader.result);
    };
    reader.onerror = () => reject(new Error("ファイル読み込みエラー"));
    reader.readAsDataURL(file);
  });
}
