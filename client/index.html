<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Client</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #fff;
    font-family: -apple-system, "Segoe UI", sans-serif;
  }
  #particles {
    position: fixed; inset: 0; z-index: 1;
    display: block; width: 100%; height: 100%;
  }
  #overlay {
    position: fixed; inset: 0; z-index: 10;
    display: none; flex-direction: column;
    background: #000;
  }
  #overlay iframe {
    flex: 1; width: 100%; border: 0; background: #fff;
  }
  #overlay .bar {
    padding: 10px 14px; background: #111;
    font-size: 13px; display: flex; justify-content: space-between;
    align-items: center; gap: 10px;
  }
  #overlay .bar span {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #overlay .bar button {
    background: #d84a4a; border: none; color: #fff;
    padding: 6px 12px; border-radius: 6px; cursor: pointer;
    flex-shrink: 0;
  }
  #status {
    position: fixed; top: 10px; left: 10px; z-index: 20;
    font-size: 11px; color: #6dffb0; background: rgba(0,0,0,0.6);
    padding: 4px 10px; border-radius: 999px; display: none;
  }
  #status.offline { color: #ff8c8c; }
  #prompt {
    position: fixed; inset: 0; z-index: 30;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.9);
  }
  #prompt .box {
    background: #111; padding: 28px 24px; border-radius: 14px;
    text-align: center; max-width: 320px;
    border: 1px solid #222;
  }
  #prompt h3 { font-size: 16px; margin-bottom: 10px; }
  #prompt p {
    font-size: 13px; color: #9aa3b2; line-height: 1.6;
    margin-bottom: 18px;
  }
  #prompt button {
    padding: 14px 22px; border-radius: 8px;
    border: none; background: #3b6cff; color: #fff;
    font-size: 15px; cursor: pointer; width: 100%;
    position: relative; z-index: 31;
  }
  #prompt button:hover { background: #2a55d8; }
  #prompt button:active { background: #1f3fb0; }
  #prompt .hint {
    font-size: 11px; color: #6b7280; margin-top: 12px;
  }
</style>
</head>
<body>

<canvas id="particles"></canvas>
<div id="status">online</div>

<div id="prompt">
  <div class="box">
    <h3>🖥️ 画面共有</h3>
    <p>管理者と画面を共有します。<br>許可してください。</p>
    <button type="button" id="startShare">画面共有を開始</button>
    <div class="hint">このアプリを閉じても通知は届きます</div>
  </div>
</div>

<div id="overlay">
  <div class="bar">
    <span id="urlLabel"></span>
    <button type="button" id="closeOverlay">閉じる</button>
  </div>
  <iframe id="contentFrame" allow="fullscreen" referrerpolicy="no-referrer"></iframe>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getDatabase, ref, onValue, set, push, update, remove, onDisconnect
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ===== Firebase 設定 =====
const firebaseConfig = {
  apiKey: "AIzaSyDsoktNvfhnMSBrHLyhSjgLBLYiih7cMFE",
  authDomain: "doong-672e7.firebaseapp.com",
  databaseURL: "https://doong-672e7-default-rtdb.firebaseio.com",
  projectId: "doong-672e7",
  storageBucket: "doong-672e7.firebasestorage.app",
  messagingSenderId: "95643976140",
  appId: "1:95643976140:web:cdcb757a9bc25bc7a75d69"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ===== 固定セッションID =====
const FIXED_SESSION_ID = "doong-room";
const sessionId = FIXED_SESSION_ID;

// ===== ★重要: ユーザーIDを sessionStorage で固定 ★ =====
// 同じタブでリロードしても同じIDを使う（重複防止）
let userId = sessionStorage.getItem("doongUserId");
if (!userId) {
  userId = "u-" + Math.random().toString(36).slice(2, 8);
  sessionStorage.setItem("doongUserId", userId);
}
console.log("My userId:", userId);

// ページ離脱時に自分のデータを削除
window.addEventListener("pagehide", () => {
  try {
    navigator.sendBeacon &&
      navigator.sendBeacon("about:blank"); // ダミー
  } catch(e){}
  remove(ref(db, `sessions/${sessionId}/users/${userId}`));
});
window.addEventListener("beforeunload", () => {
  remove(ref(db, `sessions/${sessionId}/users/${userId}`));
});

// ===== Service Worker 登録（PWA用） =====
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}

// ===== 通知許可（ユーザー操作後に要求） =====
let isForeground = true;
document.addEventListener("visibilitychange", () => {
  isForeground = document.visibilityState === "visible";
});
function notifyIfBackground(title, body) {
  if (!isForeground && "Notification" in window && Notification.permission === "granted") {
    try { new Notification(title, { body, icon: "./icons/icon-192.png" }); } catch(e){}
  }
}

// ===== オンライン状態 =====
const statusRef = ref(db, `sessions/${sessionId}/users/${userId}/status`);
set(statusRef, { online: true, lastSeen: Date.now() });
onDisconnect(statusRef).set({ online: false, lastSeen: Date.now() });
setInterval(() => update(statusRef, { lastSeen: Date.now() }), 10000);

// ===== コマンド受信（全体） =====
onValue(ref(db, `sessions/${sessionId}/command`), (snap) => {
  const cmd = snap.val();
  if (!cmd) return;
  handleCommand(cmd);
});

// ===== コマンド受信（個別） =====
onValue(ref(db, `sessions/${sessionId}/users/${userId}/command`), (snap) => {
  const cmd = snap.val();
  if (!cmd) return;
  handleCommand(cmd);
});

let lastTs = 0;
function handleCommand(cmd) {
  if (!cmd.timestamp || cmd.timestamp === lastTs) return;
  lastTs = cmd.timestamp;

  if (cmd.reset || cmd.url === "") {
    closeOverlay();
    notifyIfBackground("リセット", "管理者が表示をリセットしました");
    return;
  }
  if (cmd.url) {
    openOverlay(cmd.url);
    notifyIfBackground("URLが送信されました", cmd.url);
  }
}

// ===== Overlay 制御 =====
function openOverlay(url) {
  const overlay = document.getElementById("overlay");
  const frame = document.getElementById("contentFrame");
  const label = document.getElementById("urlLabel");

  const blocked = /(^|\.)google\.com|(^|\.)x\.com|(^|\.)twitter\.com|(^|\.)facebook\.com|(^|\.)instagram\.com|(^|\.)youtube\.com/i;
  try {
    if (blocked.test(new URL(url, location.href).hostname)) {
      window.open(url, "_blank");
      return;
    }
  } catch(e) {}

  frame.src = url;
  label.textContent = url;
  overlay.style.display = "flex";
}
function closeOverlay() {
  const overlay = document.getElementById("overlay");
  const frame = document.getElementById("contentFrame");
  frame.src = "about:blank";
  overlay.style.display = "none";
}
document.getElementById("closeOverlay").onclick = closeOverlay;

// ===== ★ 画面共有ボタン ★ =====
const rtcConfig = {
  iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
};
let pc = null;
let localStream = null;
let answerApplied = false;

const startBtn = document.getElementById("startShare");

startBtn.addEventListener("click", async (ev) => {
  ev.preventDefault();
  ev.stopPropagation();
  startBtn.disabled = true;
  startBtn.textContent = "起動中...";

  try {
    // 通知許可を先に要求（ボタン押下後なので安全）
    if ("Notification" in window && Notification.permission === "default") {
      try { await Notification.requestPermission(); } catch(e){}
    }

    localStream = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: 15 },
      audio: false
    });
    localStream.getVideoTracks()[0].onended = () => stopSharing();

    document.getElementById("prompt").style.display = "none";
    const st = document.getElementById("status");
    st.style.display = "block";
    st.classList.remove("offline");
    st.textContent = "online";

    await startWebRTC();
  } catch (e) {
    console.error(e);
    alert("画面共有が拒否されました: " + e.message);
    startBtn.disabled = false;
    startBtn.textContent = "画面共有を開始";
  }
});

async function startWebRTC() {
  pc = new RTCPeerConnection(rtcConfig);
  answerApplied = false;

  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

  pc.onicecandidate = (e) => {
    if (e.candidate) {
      push(ref(db, `sessions/${sessionId}/users/${userId}/signal/userIce`),
        e.candidate.toJSON());
    }
  };

  pc.onconnectionstatechange = () => {
    const st = document.getElementById("status");
    if (pc.connectionState === "connected") {
      st.textContent = "connected";
      st.classList.remove("offline");
    } else if (pc.connectionState === "failed" || pc.connectionState === "disconnected") {
      st.textContent = "offline";
      st.classList.add("offline");
    }
  };

  const sigRef = ref(db, `sessions/${sessionId}/users/${userId}/signal`);
  onValue(sigRef, async (snap) => {
    const sig = snap.val() || {};

    if (sig.answer && !answerApplied && pc.signalingState === "have-local-offer") {
      try {
        await pc.setRemoteDescription(new RTCSessionDescription(sig.answer));
        answerApplied = true;
      } catch(e) { console.warn(e); }
    }

    if (sig.adminIce) {
      for (const c of Object.values(sig.adminIce)) {
        try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch(e){}
      }
    }

    if (sig.adminStop) {
      const last = window.__lastStop || 0;
      if (sig.adminStop.ts > last) {
        window.__lastStop = sig.adminStop.ts;
        stopSharing();
      }
    }
  });

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await set(ref(db, `sessions/${sessionId}/users/${userId}/signal`), {
    offer: { type: offer.type, sdp: offer.sdp }
  });
}

function stopSharing() {
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  if (pc) { try { pc.close(); } catch(e){} }
  pc = null; localStream = null; answerApplied = false;
  remove(ref(db, `sessions/${sessionId}/users/${userId}/signal`));
  document.getElementById("prompt").style.display = "flex";
  document.getElementById("status").style.display = "none";
  startBtn.disabled = false;
  startBtn.textContent = "画面共有を開始";
}

// ===== 粒子アニメーション =====
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");
let particles = [];
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener("resize", () => { resize(); createParticles(); });
resize();

function createParticles() {
  const count = Math.min(Math.floor((W * H) / 18000), 220);
  particles = [];
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 2.5 + 0.4,
      vy: -(Math.random() * 0.4 + 0.1),
      vx: (Math.random() - 0.5) * 0.15,
      a: Math.random() * 0.5 + 0.2
    });
  }
}
createParticles();

function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.fillRect(0, 0, W, H);

  for (const p of particles) {
    p.y += p.vy;
    p.x += p.vx;
    if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
    if (p.x < -10) p.x = W + 10;
    if (p.x > W + 10) p.x = -10;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${p.a})`;
    ctx.fill();
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
