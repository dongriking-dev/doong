<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Client</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #fff;
    font-family: -apple-system, "Segoe UI", sans-serif;
  }
  #particles {
    position: fixed; inset: 0; z-index: 1;
    display: block; width: 100%; height: 100%;
  }
  #overlay {
    position: fixed; inset: 0; z-index: 10;
    display: none; flex-direction: column;
    background: #000;
  }
  #overlay iframe { flex: 1; width: 100%; border: 0; background: #fff; }
  #overlay .bar {
    padding: 10px 14px; background: #111;
    font-size: 13px; display: flex; justify-content: space-between;
    align-items: center; gap: 10px;
  }
  #overlay .bar span {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #overlay .bar button {
    background: #d84a4a; border: none; color: #fff;
    padding: 6px 12px; border-radius: 6px; cursor: pointer;
    flex-shrink: 0;
  }
  #status {
    position: fixed; top: 10px; left: 10px; z-index: 20;
    font-size: 11px; color: #6dffb0; background: rgba(0,0,0,0.6);
    padding: 4px 10px; border-radius: 999px; display: none;
  }
  #status.offline { color: #ff8c8c; }

  #musicInfo {
    position: fixed; bottom: 12px; left: 12px; z-index: 25;
    font-size: 11px; color: #a78bfa;
    background: rgba(0,0,0,0.7);
    padding: 6px 12px; border-radius: 999px;
    display: none;
    max-width: 70%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #musicInfo.playing { display: block; }
  #musicInfo::before { content: "🎵 "; }
</style>
</head>
<body>

<canvas id="particles"></canvas>
<div id="status">online</div>
<div id="musicInfo"></div>

<div id="overlay">
  <div class="bar">
    <span id="urlLabel"></span>
    <button type="button" id="closeOverlay">閉じる</button>
  </div>
  <iframe id="contentFrame" allow="fullscreen" referrerpolicy="no-referrer"></iframe>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getDatabase, ref, onValue, set, push, update, remove, onDisconnect
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDsoktNvfhnMSBrHLyhSjgLBLYiih7cMFE",
  authDomain: "doong-672e7.firebaseapp.com",
  databaseURL: "https://doong-672e7-default-rtdb.firebaseio.com",
  projectId: "doong-672e7",
  storageBucket: "doong-672e7.firebasestorage.app",
  messagingSenderId: "95643976140",
  appId: "1:95643976140:web:cdcb757a9bc25bc7a75d69"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const FIXED_SESSION_ID = "doong-room";
const sessionId = FIXED_SESSION_ID;

let userId = sessionStorage.getItem("doongUserId");
if (!userId) {
  userId = "u-" + Math.random().toString(36).slice(2, 8);
  sessionStorage.setItem("doongUserId", userId);
}

// ===== Service Worker =====
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}

// ===== オンライン状態 =====
const statusRef = ref(db, `sessions/${sessionId}/users/${userId}/status`);
set(statusRef, { online: true, lastSeen: Date.now() });
onDisconnect(statusRef).set({ online: false, lastSeen: Date.now() });
setInterval(() => update(statusRef, { lastSeen: Date.now() }), 10000);

window.addEventListener("pagehide", () => {
  remove(ref(db, `sessions/${sessionId}/users/${userId}`));
});

// ===== コマンド受信（全体） =====
onValue(ref(db, `sessions/${sessionId}/command`), (snap) => {
  const cmd = snap.val();
  if (!cmd) return;
  handleCommand(cmd);
});

// ===== コマンド受信（個別） =====
onValue(ref(db, `sessions/${sessionId}/users/${userId}/command`), (snap) => {
  const cmd = snap.val();
  if (!cmd) return;
  handleCommand(cmd);
});

let lastTs = 0;
function handleCommand(cmd) {
  if (!cmd.timestamp || cmd.timestamp === lastTs) return;
  lastTs = cmd.timestamp;

  if (cmd.reset || cmd.url === "") {
    closeOverlay();
    return;
  }
  if (cmd.url) openOverlay(cmd.url);
}

// ===== 画面共有要求 =====
let lastShareReqTs = 0;
onValue(ref(db, `sessions/${sessionId}/shareRequest`), (snap) => {
  const req = snap.val();
  if (!req || !req.ts) return;
  if (req.ts > lastShareReqTs) {
    lastShareReqTs = req.ts;
    autoStartShare();
  }
});

onValue(ref(db, `sessions/${sessionId}/users/${userId}/shareRequest`), (snap) => {
  const req = snap.val();
  if (!req || !req.ts) return;
  if (req.ts > lastShareReqTs) {
    lastShareReqTs = req.ts;
    autoStartShare();
  }
});

// ===== Overlay =====
function openOverlay(url) {
  const overlay = document.getElementById("overlay");
  const frame = document.getElementById("contentFrame");
  const label = document.getElementById("urlLabel");

  const blocked = /(^|\.)google\.com|(^|\.)x\.com|(^|\.)twitter\.com|(^|\.)facebook\.com|(^|\.)instagram\.com|(^|\.)youtube\.com/i;
  try {
    if (blocked.test(new URL(url, location.href).hostname)) {
      window.open(url, "_blank");
      return;
    }
  } catch(e){}

  frame.src = url;
  label.textContent = url;
  overlay.style.display = "flex";
}
function closeOverlay() {
  const overlay = document.getElementById("overlay");
  const frame = document.getElementById("contentFrame");
  frame.src = "about:blank";
  overlay.style.display = "none";
}
document.getElementById("closeOverlay").onclick = closeOverlay;

// ===== 音楽再生（Base64受信） =====
const musicEl = document.getElementById("musicInfo");
let audioEl = null;
let lastMusicTs = 0;

function playMusic(dataUrl, name) {
  if (!dataUrl) return;

  if (audioEl) {
    audioEl.pause();
    audioEl.currentTime = 0;
    audioEl = null;
  }

  audioEl = new Audio(dataUrl);
  audioEl.loop = true;
  audioEl.volume = 1.0;

  musicEl.textContent = name || "音楽";
  musicEl.classList.add("playing");

  audioEl.play().catch((err) => {
    console.warn("自動再生ブロック:", err.message);
    musicEl.textContent = (name || "音楽") + "（タップで再生）";

    const resume = () => {
      audioEl && audioEl.play().catch(()=>{});
      document.removeEventListener("click", resume);
      document.removeEventListener("touchstart", resume);
    };
    document.addEventListener("click", resume, { once: true });
    document.addEventListener("touchstart", resume, { once: true });
  });
}

function stopMusic() {
  if (audioEl) {
    audioEl.pause();
    audioEl.currentTime = 0;
    audioEl = null;
  }
  musicEl.classList.remove("playing");
  musicEl.textContent = "";
}

// 全体向け
onValue(ref(db, `sessions/${sessionId}/music`), (snap) => {
  const m = snap.val();
  if (!m || !m.timestamp) return;
  if (m.timestamp <= lastMusicTs) return;
  lastMusicTs = m.timestamp;

  if (m.play && m.audio) {
    playMusic(m.audio, m.name);
  } else {
    stopMusic();
  }
});

// 個別向け
onValue(ref(db, `sessions/${sessionId}/users/${userId}/music`), (snap) => {
  const m = snap.val();
  if (!m || !m.timestamp) return;
  if (m.timestamp <= lastMusicTs) return;
  lastMusicTs = m.timestamp;

  if (m.play && m.audio) {
    playMusic(m.audio, m.name);
  } else {
    stopMusic();
  }
});

// ===== WebRTC =====
const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
let pc = null;
let localStream = null;
let answerApplied = false;
let isSharing = false;

async function autoStartShare() {
  if (isSharing) return;
  isSharing = true;

  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
      isSharing = false;
      return;
    }

    localStream = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: 15 },
      audio: false
    });
    localStream.getVideoTracks()[0].onended = () => stopSharing();

    const st = document.getElementById("status");
    st.style.display = "block";
    st.classList.remove("offline");
    st.textContent = "online";

    await startWebRTC();
  } catch (e) {
    console.warn("画面共有は開始されませんでした:", e.message);
    isSharing = false;
  }
}

window.addEventListener("load", () => {
  setTimeout(() => { autoStartShare(); }, 300);
});

async function startWebRTC() {
  pc = new RTCPeerConnection(rtcConfig);
  answerApplied = false;

  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

  pc.onicecandidate = (e) => {
    if (e.candidate) {
      push(ref(db, `sessions/${sessionId}/users/${userId}/signal/userIce`),
        e.candidate.toJSON());
    }
  };

  pc.onconnectionstatechange = () => {
    const st = document.getElementById("status");
    if (pc.connectionState === "connected") {
      st.textContent = "connected";
      st.classList.remove("offline");
    } else if (pc.connectionState === "failed" || pc.connectionState === "disconnected") {
      st.textContent = "offline";
      st.classList.add("offline");
    }
  };

  const sigRef = ref(db, `sessions/${sessionId}/users/${userId}/signal`);
  onValue(sigRef, async (snap) => {
    const sig = snap.val() || {};

    if (sig.answer && !answerApplied && pc.signalingState === "have-local-offer") {
      try {
        await pc.setRemoteDescription(new RTCSessionDescription(sig.answer));
        answerApplied = true;
      } catch(e){}
    }

    if (sig.adminIce) {
      for (const c of Object.values(sig.adminIce)) {
        try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch(e){}
      }
    }

    if (sig.adminStop) {
      const last = window.__lastStop || 0;
      if (sig.adminStop.ts > last) {
        window.__lastStop = sig.adminStop.ts;
        stopSharing();
      }
    }
  });

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await set(ref(db, `sessions/${sessionId}/users/${userId}/signal`), {
    offer: { type: offer.type, sdp: offer.sdp }
  });
}

function stopSharing() {
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  if (pc) { try { pc.close(); } catch(e){} }
  pc = null; localStream = null; answerApplied = false;
  isSharing = false;
  remove(ref(db, `sessions/${sessionId}/users/${userId}/signal`));
  document.getElementById("status").style.display = "none";
}

// ===== 粒子アニメーション =====
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");
let particles = [];
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener("resize", () => { resize(); createParticles(); });
resize();

function createParticles() {
  const count = Math.min(Math.floor((W * H) / 14000), 260);
  particles = [];
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 2.8 + 0.5,
      vy: -(Math.random() * 0.5 + 0.15),
      vx: (Math.random() - 0.5) * 0.15,
      a: Math.random() * 0.6 + 0.3
    });
  }
}
createParticles();

function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.fillRect(0, 0, W, H);

  for (const p of particles) {
    p.y += p.vy;
    p.x += p.vx;
    if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
    if (p.x < -10) p.x = W + 10;
    if (p.x > W + 10) p.x = -10;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${p.a})`;
    ctx.fill();
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
