<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Doong</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #fff;
    font-family: -apple-system, "Segoe UI", sans-serif;
  }
  #particles {
    position: fixed; inset: 0; z-index: 1;
    display: block; width: 100%; height: 100%;
  }
  #overlay {
    position: fixed; inset: 0; z-index: 10;
    display: none; flex-direction: column;
    background: #000;
  }
  #overlay iframe {
    flex: 1; width: 100%; border: 0; background: #fff;
  }
  #overlay .bar {
    padding: 10px; text-align: center; background: #111;
    font-size: 13px; display: flex; justify-content: space-between;
    align-items: center;
  }
  #overlay .bar button {
    background: #d84a4a; border: none; color: #fff;
    padding: 6px 12px; border-radius: 6px; cursor: pointer;
  }
  #status {
    position: fixed; top: 10px; left: 10px; z-index: 20;
    font-size: 11px; color: #6dffb0; background: rgba(0,0,0,0.5);
    padding: 4px 8px; border-radius: 999px; display: none;
  }
  #prompt {
    position: fixed; inset: 0; z-index: 30;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.85);
  }
  #prompt .box {
    background: #111; padding: 24px; border-radius: 12px;
    text-align: center; max-width: 320px;
  }
  #prompt button {
    margin-top: 14px; padding: 10px 20px; border-radius: 8px;
    border: none; background: #3b6cff; color: #fff;
    font-size: 14px; cursor: pointer;
  }
</style>
</head>
<body>

<canvas id="particles"></canvas>
<div id="status">online</div>

<div id="prompt">
  <div class="box">
    <h3>画面共有の許可</h3>
    <p style="font-size:13px;color:#9aa3b2;margin-top:8px;">
      管理者に画面を共有します。許可してください。
    </p>
    <button id="startShare">画面共有を開始</button>
  </div>
</div>

<div id="overlay">
  <div class="bar">
    <span id="urlLabel"></span>
    <button id="closeOverlay">閉じる</button>
  </div>
  <iframe id="contentFrame" allow="fullscreen"></iframe>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getDatabase, ref, onValue, set, push, update, serverTimestamp,
  onDisconnect, remove
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ===== Firebase 設定 =====
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
  appId: "YOUR_APP_ID"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ===== セッションID と ユーザーID =====
const params = new URLSearchParams(location.search);
const sessionId = params.get("s") || "default";
let userId = params.get("u");
if (!userId) {
  userId = "u-" + Math.random().toString(36).slice(2, 8);
  params.set("u", userId);
  history.replaceState(null, "", "?" + params.toString());
}

// ===== オンライン状態管理 =====
const userRef = ref(db, `sessions/${sessionId}/users/${userId}`);
const statusRef = ref(db, `sessions/${sessionId}/users/${userId}/status`);
set(statusRef, { online: true, lastSeen: Date.now() });
onDisconnect(statusRef).set({ online: false, lastSeen: Date.now() });
setInterval(() => update(statusRef, { lastSeen: Date.now() }), 15000);

// ===== 通知（アプリを閉じている/バックグラウンド時） =====
let isForeground = true;
document.addEventListener("visibilitychange", () => {
  isForeground = document.visibilityState === "visible";
});

if ("Notification" in window && Notification.permission === "default") {
  Notification.requestPermission();
}

function notifyIfBackground(title, body) {
  if (!isForeground && "Notification" in window && Notification.permission === "granted") {
    new Notification(title, { body, icon: "" });
  }
}

// ===== コマンド受信（全員向け） =====
onValue(ref(db, `sessions/${sessionId}/command`), (snap) => {
  const cmd = snap.val();
  if (!cmd) return;
  handleCommand(cmd, "all");
});

// ===== コマンド受信（個別） =====
onValue(ref(db, `sessions/${sessionId}/users/${userId}/command`), (snap) => {
  const cmd = snap.val();
  if (!cmd) return;
  handleCommand(cmd, "individual");
});

let lastTs = 0;
function handleCommand(cmd, scope) {
  if (!cmd.timestamp || cmd.timestamp === lastTs) return;
  lastTs = cmd.timestamp;

  if (cmd.reset || cmd.url === "") {
    closeOverlay();
    notifyIfBackground("リセット", "管理者が表示をリセットしました");
    return;
  }
  if (cmd.url) {
    openOverlay(cmd.url);
    notifyIfBackground("URLが送信されました", cmd.url);
  }
}

function openOverlay(url) {
  const overlay = document.getElementById("overlay");
  const frame = document.getElementById("contentFrame");
  const label = document.getElementById("urlLabel");
  frame.src = url;
  label.textContent = url;
  overlay.style.display = "flex";
}
function closeOverlay() {
  const overlay = document.getElementById("overlay");
  const frame = document.getElementById("contentFrame");
  frame.src = "about:blank";
  overlay.style.display = "none";
}
document.getElementById("closeOverlay").onclick = closeOverlay;

// ===== WebRTC 画面共有 =====
const rtcConfig = {
  iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
};

let pc = null;
let localStream = null;

document.getElementById("startShare").onclick = async () => {
  try {
    localStream = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: 15 },
      audio: false
    });
    document.getElementById("prompt").style.display = "none";
    document.getElementById("status").style.display = "block";
    await startWebRTC();
  } catch (e) {
    alert("画面共有が拒否されました: " + e.message);
  }
};

async function startWebRTC() {
  pc = new RTCPeerConnection(rtcConfig);

  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

  pc.onicecandidate = (e) => {
    if (e.candidate) {
      push(ref(db, `sessions/${sessionId}/users/${userId}/signal/userIce`),
        e.candidate.toJSON());
    }
  };

  // 管理者側からの answer を監視
  onValue(ref(db, `sessions/${sessionId}/users/${userId}/signal`), async (snap) => {
    const sig = snap.val() || {};
    if (sig.answer && pc.signalingState === "have-local-offer") {
      await pc.setRemoteDescription(new RTCSessionDescription(sig.answer));
    }
    if (sig.adminIce) {
      for (const c of Object.values(sig.adminIce)) {
        try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch(e){}
      }
    }
    if (sig.adminStop && sig.adminStop.ts > (startWebRTC.lastStop || 0)) {
      startWebRTC.lastStop = sig.adminStop.ts;
      stopSharing();
    }
  });

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  set(ref(db, `sessions/${sessionId}/users/${userId}/signal/offer`), {
    type: offer.type, sdp: offer.sdp
  });
  // 前回の answer をクリア
  remove(ref(db, `sessions/${sessionId}/users/${userId}/signal/answer`));
}

function stopSharing() {
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  if (pc) pc.close();
  pc = null; localStream = null;
  document.getElementById("prompt").style.display = "flex";
  document.getElementById("status").style.display = "none";
  remove(ref(db, `sessions/${sessionId}/users/${userId}/signal`));
}

// ===== 粒子アニメーション =====
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");
let particles = [];
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

function createParticles() {
  const count = Math.floor((W * H) / 18000);
  particles = [];
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 2.5 + 0.5,
      vy: -(Math.random() * 0.4 + 0.1),
      vx: (Math.random() - 0.5) * 0.15,
      a: Math.random() * 0.5 + 0.2
    });
  }
}
createParticles();
window.addEventListener("resize", createParticles);

function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.fillRect(0, 0, W, H);

  for (const p of particles) {
    p.y += p.vy;
    p.x += p.vx;
    if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
    if (p.x < -10) p.x = W + 10;
    if (p.x > W + 10) p.x = -10;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${p.a})`;
    ctx.fill();
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
